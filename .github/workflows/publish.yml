name: Publish to npm
on:
  push: {branches: [main]}
  workflow_dispatch:
concurrency: {group: npm-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.25.0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', registry-url: 'https://registry.npmjs.org', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lib
      - run: pnpm test
      - id: version
        run: node scripts/check-npm-release.mjs
      - if: steps.version.outputs.publish == 'true'
        run: npm pack ./packages/imessage-html-recreation --dry-run
      - if: steps.version.outputs.publish == 'true'
        run: npm publish ./packages/imessage-html-recreation --access public --provenance
