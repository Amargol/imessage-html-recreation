<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iMessage conversation</title><style>html,body{margin:0;padding:0;background:#000}body{width:440px;color:white;position:relative}*{box-sizing:border-box}.reference-avatar{width:60px;height:60px;border-radius:50%;background-image:url('/avatars/alex.png');background-size:cover;background-position:center}imessage-bubble .emoji{font-size:21px;line-height:0;vertical-align:-1px}imessage-bubble u{text-decoration-color:#ffffff70;text-decoration-thickness:1px;text-underline-offset:3px}imessage-header[slot=header]{z-index:4}#local-feedback{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#333e;color:#fff;border:1px solid #7775;border-radius:20px;padding:9px 15px;font:13px -apple-system,Arial;z-index:20;white-space:nowrap}#local-feedback:empty{display:none}</style><script type="module" src="/lib/index.js"></script></head><body style="background:#000000"><imessage-conversation theme="dark" scrollable="false" style="--im-height:956px;--im-background:#000000;--im-sent-top:#2995ff;--im-sent-bottom:#078fff;--im-received:#262628;--im-font-size:17px;--im-line-height:20.00px;--im-max-width:78%">



 <imessage-bubble direction="received" tail="true">How much do we owe you?</imessage-bubble>
 <imessage-bubble direction="sent" status="Read 12:53 PM" tail="true"><u>$17.64</u> each!</imessage-bubble>


</imessage-conversation><output id="local-feedback" aria-live="polite"></output><script>const c=document.querySelector('imessage-conversation');c?.addEventListener('imessage:send',e=>{const b=document.createElement('imessage-bubble');b.setAttribute('direction','sent');b.setAttribute('status','Delivered');b.textContent=e.detail.text;c.append(b);});for(const action of ['back','video','profile','add','microphone','keyboard-action'])c?.addEventListener('imessage:'+action,()=>{const f=document.getElementById('local-feedback');f.textContent=action==='back'?'Back button clicked':action==='profile'?'Profile button clicked':action==='add'?'Attachment button clicked':action==='video'?'Video button clicked':'Audio / keyboard action';clearTimeout(window.feedbackTimer);window.feedbackTimer=setTimeout(()=>f.textContent='',1800);});</script></body></html>
